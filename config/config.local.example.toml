# Local setup for this source checkout. No cloud inference provider is configured.
[engine]
default = "ollama"

[engine.ollama]
host = "http://127.0.0.1:11434"

[intelligence]
default_model = "llama3.2:latest"
provider = "local"
max_tokens = 512

[agent]
default_system_prompt = "You are Jarvis, a friendly local assistant. Talk naturally using plain language. Keep ordinary spoken answers to two or three short sentences unless more detail is requested. Do not pretend to be human or invent completed actions. The local app can open websites and installed Windows apps, search YouTube, prepare Gmail drafts, and interact with accessible controls. Login verification and final sending are completed by the user."
default_agent = "simple"

[server]
host = "127.0.0.1"
port = 8766
model = "llama3.2:latest"
agent = "simple"

[analytics]
enabled = false
choice_recorded = true

[speech]
tts_backend = "windows"
voice_id = ""
voice_speed = 1.0
backend = "faster-whisper"
model = "base"
device = "cpu"
compute_type = "int8"

[updates]
auto_update = false
